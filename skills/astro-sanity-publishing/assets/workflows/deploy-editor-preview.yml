# Adapt every __TOKEN__ using references/delivery.md before activation.
name: Deploy editor preview

on:
  push:
    branches: ['__PRODUCTION_BRANCH__']
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanity-editor-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      stale: ${{ steps.deploy.outputs.stale }}
    defaults:
      run:
        working-directory: '__APP_DIR__'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '__PRODUCTION_BRANCH__'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '__NODE_VERSION__'
          cache: npm
          cache-dependency-path: '__APP_LOCKFILE__'
      - run: npm ci
      - name: Build editor runtime
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.SANITY_DATASET }}
          PUBLIC_SANITY_STUDIO_URL: ${{ vars.SANITY_STUDIO_URL }}
        run: |
          npm run build:editor-preview
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - name: Deploy current preview
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: ${{ vars.EDITOR_WORKER_NAME }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN" && test -n "$WORKER_NAME"
          git fetch --no-tags origin '__PRODUCTION_BRANCH__'
          checkout_sha=$(git rev-parse HEAD)
          if [ "$(git rev-parse FETCH_HEAD)" != "$checkout_sha" ]; then
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            echo '::notice::Production branch advanced; skip upload and dispatch current branch'
            exit 0
          fi
          test -z "$(git status --porcelain)"
          test -f '__WORKER_CONFIG__'
          npx --no-install wrangler deploy --config '__WORKER_CONFIG__' --name "$WORKER_NAME" --keep-vars --message "editor-preview@$checkout_sha"
      - name: Verify active Worker version
        if: steps.deploy.outputs.stale != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: ${{ vars.EDITOR_WORKER_NAME }}
        run: |
          checkout_sha=$(git rev-parse HEAD)
          for attempt in {1..6}; do
            if npx --no-install wrangler deployments list --name "$WORKER_NAME" --json > "$RUNNER_TEMP/worker-deployments.json" && \
              node scripts/verify-worker-deployment.mjs "$RUNNER_TEMP/worker-deployments.json" "$checkout_sha"; then
              echo "Verified active editor Worker at $checkout_sha" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo '::error::Active Worker deployment does not match checkout'
          exit 1

  reconcile:
    needs: deploy
    if: needs.deploy.outputs.stale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Queue current production branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run deploy-editor-preview.yml --ref '__PRODUCTION_BRANCH__'
          echo 'Dispatched current production branch; stale artifact not uploaded.' >> "$GITHUB_STEP_SUMMARY"
